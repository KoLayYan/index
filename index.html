<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFire Direct Link Generator Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font: Inter & Padauk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Padauk', sans-serif;
            background: radial-gradient(circle at top right, #0f172a, #020617);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="w-full max-w-xl mx-auto text-center mb-6 pt-4">
        <div class="inline-flex items-center justify-center p-3 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl mb-3 text-emerald-400 shadow-lg">
            <i data-lucide="zap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-1">
            MediaFire <span class="text-emerald-400">Direct Link Pro</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-400">
            MediaFire လင့်ခ်များကို မြန်ဆန်လွယ်ကူစွာ တိုက်ရိုက်လင့်ခ်ပြောင်းပါ။
        </p>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-xl mx-auto flex-1 flex flex-col justify-center">
        <div class="glass-card p-5 sm:p-7 rounded-3xl shadow-2xl relative overflow-hidden">
            
            <!-- Input Section -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5">
                        <i data-lucide="link" class="w-3.5 h-3.5 text-emerald-400"></i> MediaFire Share Link ထည့်ရန်
                    </label>
                    <div class="relative">
                        <input type="text" id="mediafireUrl" placeholder="https://www.mediafire.com/file/..." 
                            class="w-full pl-4 pr-24 py-3.5 bg-slate-900/90 border border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm text-slate-100 placeholder-slate-500">
                        <button onclick="pasteLink()" class="absolute right-2 top-1.5 bottom-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-xl transition flex items-center gap-1 border border-slate-700">
                            <i data-lucide="clipboard" class="w-3.5 h-3.5"></i> ကူးထည့်
                        </button>
                    </div>
                </div>
                
                <button onclick="generateLink()" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white py-3.5 px-6 rounded-2xl font-bold text-sm transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <i data-lucide="cpu" class="w-4 h-4"></i>
                    <span>တိုက်ရိုက်လင့်ခ် ထုတ်ယူမည်</span>
                </button>
            </div>

            <!-- Loading -->
            <div id="loading" class="hidden text-center my-6">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                <p class="text-xs text-slate-300 mt-2">လင့်ခ်ကို ရှာဖွေနေပါသည်...</p>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="mt-6 hidden space-y-4 border-t border-slate-700/60 pt-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center gap-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400"></i> ရရှိလာသော တိုက်ရိုက်လင့်ခ်
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="directUrl" readonly class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300 font-mono">
                        <button onclick="copyResult()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-xl text-xs font-semibold transition text-white shrink-0">
                            ကူးယူရန်
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <a id="downloadBtn" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-xs font-bold transition">
                        <i data-lucide="download" class="w-4 h-4"></i> ဒေါင်းလုဒ်ဆွဲရန်
                    </a>
                    <a id="browserBtn" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-xs font-bold transition">
                        <i data-lucide="external-link" class="w-4 h-4"></i> ဘရောက်ဆာဖွင့်ရန်
                    </a>
                </div>
            </div>

            <!-- Error Box -->
            <div id="errorBox" class="mt-5 hidden bg-red-950/50 border border-red-800 text-red-300 p-3.5 rounded-xl text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i>
                <span id="errorText">အမှားအယွင်းရှိနေပါသည်။</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-xl mx-auto text-center mt-6 text-xs text-slate-500">
        <p>MediaFire Direct Link Generator &bull; Secure Web App</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        lucide.createIcons();

        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('mediafireUrl').value = text;
            } catch (err) {
                alert('ကလစ်ဘုတ်မှ ကူးယူခွင့် မရှိပါ။');
            }
        }

        async function generateLink() {
            const urlInput = document.getElementById('mediafireUrl').value.trim();
            const resultBox = document.getElementById('resultBox');
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('errorBox');

            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            if (!urlInput.includes('mediafire.com')) {
                showError('မှန်ကန်သော MediaFire လင့်ခ် ထည့်သွင်းပါ။');
                return;
            }

            loading.classList.remove('hidden');

            try {
                // CORS ကျော်ရန် ယုံကြည်စိတ်ချရသော Public Proxy ကို အသုံးပြုခြင်း
                const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlInput)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('ဆာဗာချိတ်ဆက်မှု မအောင်မြင်ပါ။');

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // MediaFire ၏ Download Button ID ကို တိုက်ရိုက်ရှာဖွေခြင်း
                const downloadBtn = doc.getElementById('downloadButton');
                const directLink = downloadBtn ? downloadBtn.getAttribute('href') : null;

                loading.classList.add('hidden');

                if (directLink && directLink.startsWith('http')) {
                    document.getElementById('directUrl').value = directLink;
                    document.getElementById('downloadBtn').href = directLink;
                    document.getElementById('browserBtn').href = directLink;
                    resultBox.classList.remove('hidden');
                } else {
                    showError('တိုက်ရိုက်လင့်ခ် ထုတ်ယူ၍မရပါ။ လင့်ခ်အမျိုးအစားကို စစ်ဆေးပါ။');
                }

            } catch (err) {
                loading.classList.add('hidden');
                showError('ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။ ခဏနေမှ ထပ်ကြိုးစားပါ။');
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            document.getElementById('errorText').textContent = msg;
            errorBox.classList.remove('hidden');
        }

        function copyResult() {
            const copyText = document.getElementById('directUrl');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('လင့်ခ်ကို ကူးယူပြီးပါပြီ။');
        }
    </script>
</body>
</html>
